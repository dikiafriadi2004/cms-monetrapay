version: '3.8'

# ============================================================
# SSL Extension untuk docker-compose.yml
# Pakai jika tidak menggunakan Cloudflare
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
# ============================================================

services:

  # Override app: expose port 443 juga
  app:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage_data:/var/www/html/storage/app/public
      - logs_data:/var/www/html/storage/logs
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - ./docker/nginx/ssl.conf:/etc/nginx/http.d/ssl.conf:ro

  # Certbot untuk generate & renew SSL
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Auto-renew setiap 12 jam
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  certbot_www:
  certbot_certs:
